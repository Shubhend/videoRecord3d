<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge AI Avatar — Live</title>
    <link rel="icon" href="./assets/B_SY1GJM.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-0: #0a0e1a;
        --bg-1: #0f1424;
        --bg-2: #161c30;
        --accent: #00ff88;
        --accent-dim: #00b86a;
        --text: #e7ecf3;
        --text-dim: #9aa3b2;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --danger: #ff5566;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #16213e 0%, #0a0e1a 60%, #06080f 100%);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #avatar-canvas { width: 100vw; height: 100vh; display: block; }

      /* ---------- Top nav ---------- */
      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 60;
        background: linear-gradient(180deg, rgba(10, 14, 26, 0.85), rgba(10, 14, 26, 0));
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.2px;
      }
      .brand-mark {
        width: 28px; height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #00c2ff);
        display: flex; align-items: center; justify-content: center;
        color: #021; font-weight: 800;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.35);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* ---------- Model selector ---------- */
      .model-chip-wrap {
        position: relative;
      }
      .model-chip {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 8px 10px;
        background: rgba(22, 28, 48, 0.7);
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
        line-height: 1;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
        user-select: none;
      }
      .model-chip:hover { background: rgba(30, 38, 64, 0.85); border-color: rgba(0, 255, 136, 0.35); }
      .model-chip-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .model-chip-name { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .model-chip-caret {
        opacity: 0.7;
        transition: transform 0.2s;
      }
      .model-chip[aria-expanded="true"] .model-chip-caret { transform: rotate(180deg); }

      .model-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 280px;
        max-height: 360px;
        overflow-y: auto;
        background: rgba(15, 20, 36, 0.96);
        border: 1px solid var(--border-strong);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        padding: 6px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
      }
      .model-menu.open { display: block; }
      .model-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
        transition: background 0.12s;
      }
      .model-menu-item:hover { background: rgba(255, 255, 255, 0.05); }
      .model-menu-item.active { background: rgba(0, 255, 136, 0.08); }
      .model-menu-item .check {
        margin-left: auto;
        color: var(--accent);
        opacity: 0;
        font-size: 14px;
      }
      .model-menu-item.active .check { opacity: 1; }
      .model-menu-item .meta {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      .model-menu-empty {
        padding: 14px;
        color: var(--text-dim);
        font-size: 12px;
        text-align: center;
      }
      .model-menu-divider {
        height: 1px;
        background: var(--border);
        margin: 6px 4px;
      }
      .model-menu-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .model-menu-link:hover { background: rgba(0, 255, 136, 0.08); }
      button.model-menu-link {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        text-align: left;
        color: var(--text);
      }
      button.model-menu-link:hover { color: var(--accent); }

      /* ---------- Icon buttons ---------- */
      .icon-btn {
        width: 38px; height: 38px;
        background: rgba(22, 28, 48, 0.7);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      .icon-btn:hover { background: rgba(30, 38, 64, 0.9); border-color: rgba(0, 255, 136, 0.4); transform: translateY(-1px); }
      .icon-btn.active { background: var(--accent); color: #021; border-color: var(--accent); }
      .icon-btn.recording {
        background: var(--danger);
        color: #fff;
        border-color: var(--danger);
        animation: rec-pulse 1.4s infinite;
      }
      @keyframes rec-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 85, 102, 0.6); }
        50% { box-shadow: 0 0 0 8px rgba(255, 85, 102, 0); }
      }

      /* ---------- Record indicator (live timer) ---------- */
      #rec-indicator {
        position: fixed;
        top: 76px;
        right: 16px;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(15, 20, 36, 0.92);
        border: 1px solid rgba(255, 85, 102, 0.55);
        border-radius: 999px;
        color: #fff;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        z-index: 55;
        box-shadow: 0 6px 20px rgba(255, 85, 102, 0.18);
      }
      #rec-indicator.show { display: inline-flex; }
      #rec-indicator .rec-dot {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: var(--danger);
        animation: rec-pulse-dot 1s infinite;
      }
      @keyframes rec-pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* ---------- Audio lipsync panel ---------- */
      #audio-panel {
        position: fixed;
        top: 76px;
        right: 16px;
        width: 320px;
        background: rgba(15, 20, 36, 0.96);
        border: 1px solid var(--border-strong);
        border-radius: 14px;
        padding: 14px;
        z-index: 56;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
      }
      #audio-panel.show { display: block; }
      #audio-panel .ap-title {
        display: flex; justify-content: space-between; align-items: center;
        font-weight: 700; font-size: 14px;
        margin-bottom: 4px;
      }
      #audio-panel .ap-title button {
        background: none; border: 0; color: var(--text-dim); cursor: pointer; font-size: 18px; line-height: 1;
      }
      #audio-panel .ap-desc {
        color: var(--text-dim); font-size: 12px; margin-bottom: 12px;
      }
      #audio-panel .ap-file {
        background: rgba(22, 28, 48, 0.7);
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        font-size: 12px;
        color: var(--text-dim);
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #audio-panel .ap-file:hover {
        border-color: var(--accent);
        background: rgba(0, 255, 136, 0.04);
      }
      #audio-panel .ap-file.has-file {
        color: var(--text);
        border-style: solid;
        text-align: left;
      }
      #audio-panel .ap-file-name { font-weight: 600; word-break: break-all; }
      #audio-panel .ap-file-meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
      #audio-panel .ap-actions {
        display: flex; gap: 8px; margin-top: 12px;
        flex-wrap: wrap;
      }
      #audio-panel button.ap-btn {
        flex: 1;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-strong);
        background: rgba(22, 28, 48, 0.7);
        color: var(--text);
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      #audio-panel button.ap-btn:hover { background: rgba(30, 38, 64, 0.9); border-color: rgba(0, 255, 136, 0.4); }
      #audio-panel button.ap-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      #audio-panel button.ap-btn.primary {
        background: var(--accent);
        color: #021;
        border-color: var(--accent);
      }
      #audio-panel button.ap-btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
      #audio-panel button.ap-btn.danger {
        background: rgba(255, 85, 102, 0.15);
        border-color: rgba(255, 85, 102, 0.55);
        color: var(--danger);
      }

      /* ---------- Status pill ---------- */
      #status {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 50;
        background: rgba(15, 20, 36, 0.78);
        border: 1px solid var(--border-strong);
        color: var(--text);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        padding: 8px 12px;
        border-radius: 8px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* ---------- Webcam ---------- */
      #webcam { position: fixed; top: -9999px; left: -9999px; }
      #debug-video {
        position: fixed; bottom: 16px; right: 16px;
        width: 200px; height: 150px;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        z-index: 50;
        opacity: 0.92;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        object-fit: cover;
      }

      /* ---------- Loading overlay ---------- */
      #loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        background: radial-gradient(ellipse at center, #16213e 0%, #0a0e1a 70%);
        z-index: 100;
        transition: opacity 0.5s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 56px; height: 56px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-left-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text { color: var(--text-dim); margin-top: 18px; font-size: 13px; letter-spacing: 0.4px; }
      @keyframes spin { 100% { transform: rotate(360deg); } }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        opacity: 0;
        background: rgba(15, 20, 36, 0.95);
        border: 1px solid var(--border-strong);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        z-index: 200;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.error { border-color: rgba(255, 85, 102, 0.45); }

      /* ---------- Responsive ---------- */
      @media (max-width: 640px) {
        .topbar { padding: 0 12px; height: 56px; }
        .model-chip-name { max-width: 120px; }
        #debug-video { width: 140px; height: 105px; }
      }
    </style>

  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">EA</span>
        <span>Edge AI Avatar</span>
      </div>
      <div class="topbar-actions">
        <div class="model-chip-wrap">
          <button id="model-chip" class="model-chip" aria-haspopup="listbox" aria-expanded="false" title="Switch model">
            <span class="model-chip-dot"></span>
            <span id="model-chip-name" class="model-chip-name">Loading…</span>
            <svg class="model-chip-caret" width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="model-menu" class="model-menu" role="listbox" aria-label="Available models"></div>
        </div>
        <button id="save-cam-btn" class="icon-btn" title="Save camera view for recording" aria-label="Save camera view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h4l2-2h4l2 2h4v12H4V7z"/>
            <circle cx="12" cy="13" r="3.5"/>
          </svg>
        </button>
        <a href="record.html" class="icon-btn" title="Record webcam video" aria-label="Webcam record" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="14" rx="2"/>
            <circle cx="12" cy="13" r="3" fill="currentColor"/>
          </svg>
        </a>
        <a href="cameras.html" class="icon-btn" title="Manage saved camera views" aria-label="Camera views" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M8 5l2-2h4l2 2"/>
          </svg>
        </a>
        <button id="bird-btn" class="icon-btn" title="Bird's eye view" aria-label="Bird view">🐦</button>
        <button id="speaker-btn" class="icon-btn" title="Toggle audio" aria-label="Toggle audio">🔊</button>
        <button id="audio-btn" class="icon-btn" title="Audio lip-sync" aria-label="Audio lip-sync">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1v22"/>
            <path d="M8 5v14"/>
            <path d="M16 8v8"/>
            <path d="M4 9v6"/>
            <path d="M20 11v2"/>
          </svg>
        </button>
        <button id="record-btn" class="icon-btn" title="Record video" aria-label="Record">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
        </button>
        <a href="settings.html" class="icon-btn" title="Settings" aria-label="Open settings" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06A2 2 0 114.27 16.96l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06A2 2 0 117.04 4.27l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06A2 2 0 1119.73 7.04l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </a>
      </div>
    </header>

    <div id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">Initializing…</p>
    </div>

    <div id="status">Tracking: Initializing…</div>
    <video id="webcam" playsinline autoplay muted></video>
    <video id="debug-video" playsinline autoplay muted></video>
    <canvas id="avatar-canvas"></canvas>

    <div id="rec-indicator">
      <span class="rec-dot"></span>
      <span>REC</span>
      <span id="rec-timer">00:00</span>
    </div>

    <div id="audio-panel" role="dialog" aria-label="Audio lip-sync">
      <div class="ap-title">
        <span>Audio Lip-Sync</span>
        <button id="ap-close" aria-label="Close">×</button>
      </div>
      <div class="ap-desc">Upload an audio file. The avatar's mouth will move in sync with the audio. Click "Play &amp; Record" to export a video file with audio embedded.</div>
      <div id="ap-file" class="ap-file">
        <div>Click to choose an audio file</div>
        <div class="ap-file-meta">.mp3, .wav, .ogg, .m4a</div>
      </div>
      <input id="ap-file-input" type="file" accept="audio/*" hidden />
      <div class="ap-actions">
        <button id="ap-play" class="ap-btn primary" disabled>▶ Play</button>
        <button id="ap-record" class="ap-btn primary" disabled>● Play &amp; Record</button>
        <button id="ap-stop" class="ap-btn danger" disabled>■ Stop</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
